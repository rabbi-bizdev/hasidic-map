<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Генеалогия первых трёх поколений хасидизма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F2F2F7;color:#000;font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:1400px;margin:0 auto}
button{font-family:inherit}a{color:inherit}
:focus-visible{outline:2px solid #007AFF;outline-offset:1px}

.nav{position:sticky;top:0;z-index:80;background:rgba(242,242,247,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(60,60,67,.29);padding:10px 16px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-size:28px;font-weight:700;letter-spacing:-.022em}
.wide .title{font-size:22px}
.submeta{font-size:13px;color:rgba(60,60,67,.6);margin-top:3px;font-variant-numeric:tabular-nums}
.search{width:100%;margin-top:8px;height:36px;border:none;border-radius:10px;background:rgba(118,118,128,.12);padding:0 12px;font-size:17px;color:#000;-webkit-appearance:none}
.wide .search{width:220px;height:30px;font-size:13px;margin:0}
.tools{display:flex;align-items:center;gap:8px}
.toolbtn{height:30px;border:none;border-radius:8px;background:rgba(118,118,128,.12);color:#007AFF;font-size:13px;padding:0 12px;cursor:pointer;white-space:nowrap}
.toolbtn.on{background:#007AFF;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;border:none;border-radius:16px;background:rgba(118,118,128,.12);padding:0 10px;font-size:13px;color:#000;cursor:pointer}
.chip.offc{color:rgba(60,60,67,.35)}
.chdot{width:8px;height:8px;border-radius:50%}
.chcnt{color:rgba(60,60,67,.4);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin-top:10px}
.wide .seg{width:300px}
.segbtn{flex:1;height:28px;border:none;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:#000;cursor:pointer}
.segbtn.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.card{position:relative;background:#fff;border:1px solid rgba(60,60,67,.06);border-left:3px solid #888;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:box-shadow .15s,opacity .15s}
.wide .card{border-radius:10px;padding:9px 11px;width:100%}
.chead{display:flex;align-items:baseline;gap:6px}
.cname{font-weight:600;font-size:17px;letter-spacing:-.015em;flex:1;line-height:1.22;overflow-wrap:break-word;word-break:normal;hyphens:none}
.wide .cname{font-size:15px;letter-spacing:-.012em}
.cflag{color:#C7361E;font-size:13px;font-weight:600;flex:0 0 auto}
.chev{color:rgba(60,60,67,.3);font-size:17px;flex:0 0 auto}
.cyear{color:rgba(60,60,67,.6);font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.wide .cyear{font-size:12px}
.dots{display:flex;gap:4px;margin-left:auto;align-items:center;flex:0 0 auto}
.dot{width:6px;height:6px;border-radius:50%;border:1px solid transparent;box-sizing:border-box}
.wide .dot{width:5px;height:5px}
.cbranch{margin-top:6px}
.btag{display:inline-flex;align-items:center;gap:5px}
.bdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.btxt{font-size:12px;color:rgba(60,60,67,.5)}
.cmuv{margin-top:9px;padding-top:9px;border-top:.5px solid rgba(60,60,67,.18);display:flex;flex-direction:column;gap:3px}
.mlbl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:rgba(60,60,67,.4);flex:0 0 auto}
.mval{font-size:13px;color:#000}
.mval.dim{color:rgba(60,60,67,.4)}
.calso{margin-top:8px}
.microlbl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:rgba(60,60,67,.4);margin:8px 0 6px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(118,118,128,.1);border:none;border-radius:10px;min-height:32px;padding:0 12px;font-size:13px;color:#000;cursor:pointer;text-align:left}
.pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.prel{color:rgba(60,60,67,.5);font-size:12px}
.cexp{margin-top:9px;padding-top:9px;border-top:.5px solid rgba(60,60,67,.18)}
.che{font-family:ui-serif,"New York","Frank Ruhl Libre","Times New Roman",serif;font-size:20px;text-align:right;line-height:1.35;direction:rtl;unicode-bidi:isolate}
.cgist{font-size:15px;color:rgba(60,60,67,.85);margin-top:6px;line-height:1.4}
.cnote{font-size:13px;color:#C7361E;margin-top:6px;line-height:1.35}
.srcrow{display:flex;align-items:center;gap:10px;min-height:44px;border-top:.5px solid rgba(60,60,67,.18);text-decoration:none;color:inherit}
.sbadge{width:22px;height:22px;border-radius:5px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.sname{font-size:15px;color:#000}
.sstat{font-size:13px;color:rgba(60,60,67,.6);margin-left:auto}
.card.sel{box-shadow:0 0 0 2px #007AFF,0 8px 22px rgba(0,0,0,.1)}
.card.dim{opacity:.16}

.popover{position:absolute;z-index:60;background:#fff;border:1px solid rgba(60,60,67,.08);border-left:3px solid #888;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.14);pointer-events:auto;max-height:72vh;overflow:auto}

.mwrap{padding:12px 16px 80px}
.mwrap>.card,.mwrap .trow{margin-bottom:10px}
.trow{position:relative}
.rail{position:absolute;top:0;bottom:0;width:1.5px}
.genhdr{display:flex;align-items:baseline;gap:8px;padding:16px 0 8px;border-bottom:.5px solid rgba(60,60,67,.18);margin-bottom:8px}
.ghn{font-size:15px;font-weight:600}
.ghmeta{font-size:13px;color:rgba(60,60,67,.6)}
.ghcnt{margin-left:auto;color:rgba(60,60,67,.35);font-variant-numeric:tabular-nums}
.brhdr{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:rgba(60,60,67,.6);padding:8px 4px 6px}

.stage{position:relative;overflow:auto;padding:10px 20px 80px}
svg.edges{position:absolute;top:10px;left:20px;pointer-events:none;z-index:0;overflow:visible}
.rowsgrid{position:relative;z-index:1}
.genrow{display:flex;gap:12px;margin-bottom:28px}
.genlabel{width:108px;flex:0 0 108px}
.gln{font-size:15px;font-weight:600}
.gllabel{font-size:13px;color:rgba(60,60,67,.6);margin-top:2px}
.glmeta{font-size:12px;color:rgba(60,60,67,.4);margin-top:2px;font-variant-numeric:tabular-nums}
.genbody{display:flex;flex-wrap:wrap;gap:18px;flex:1;align-content:flex-start}
.subcol{width:228px}
.subhdr{display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:.5px solid rgba(60,60,67,.18);margin-bottom:9px}
.subttl{font-size:12px;font-weight:500;color:rgba(60,60,67,.6)}
.subcnt{margin-left:auto;font-size:12px;color:rgba(60,60,67,.35);font-variant-numeric:tabular-nums}
.subcol .card{margin-bottom:9px}
.laneswrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.lane{width:220px}
.lanehdr{display:flex;align-items:center;gap:6px;border-bottom:2px solid #888;padding-bottom:6px;margin-bottom:8px}
.lanettl{font-size:13px;font-weight:600}
.laneband{margin-bottom:8px;padding-bottom:8px;border-bottom:.5px dashed rgba(60,60,67,.25)}
.laneband .card{margin-bottom:8px}

.ovwrap{padding:8px 12px 40px;position:relative}
.ovbox{position:relative}
.ovsvg{width:100%;height:auto;display:block}
.ovlabels{position:absolute;inset:0;pointer-events:none}
.genlab{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:600;color:rgba(60,60,67,.5)}
.hublab{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;font-weight:600;color:rgba(60,60,67,.85);white-space:nowrap}
.ovpanel{position:sticky;bottom:12px;margin:12px 4px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;border-left:3px solid #888;box-shadow:0 8px 26px rgba(0,0,0,.14);padding:12px 14px}
.oprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.opname{font-size:17px;font-weight:600}
.opyear{font-size:13px;color:rgba(60,60,67,.6);font-variant-numeric:tabular-nums}
.ovpanel .cmuv{border-top:none;padding-top:6px;margin-top:6px}
.ovpanel .btag{margin-top:6px}
.opbtns{display:flex;gap:8px;margin-top:10px}
.opopen{flex:1;height:40px;border:none;border-radius:10px;background:#007AFF;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.opclose{width:40px;height:40px;border:none;border-radius:10px;background:rgba(118,118,128,.12);color:#007AFF;font-size:16px;cursor:pointer}
.hint{padding:10px 20px 30px;font-size:12px;color:rgba(60,60,67,.5)}
.cnick{font-weight:400;color:rgba(60,60,67,.45);font-size:.9em}
.stubt{font-size:13px;color:rgba(60,60,67,.55);align-self:center;padding:0 4px}
.card.ctx{opacity:.5}
.chip.onc{background:rgba(0,122,255,.14);color:#0A5FB4;font-weight:500}
.descrow{margin-top:8px}
</style>
</head>

    var seg = wide
      ? segControl([{ k: "rows", t: "Ряды" }, { k: "lanes", t: "Дорожки" }, { k: "overview", t: "Обзор" }], S.wview, function (k) { S.wview = k; render(); })
      : segControl([{ k: "overview", t: "Обзор" }, { k: "tree", t: "Древо" }, { k: "list", t: "Список" }], S.mview, function (k) { S.mview = k; render(); });
    nav.appendChild(seg);
    root.appendChild(nav);

    // body
    var body;
    if (view === "overview") body = viewOverview(wide);
    else if (view === "tree") body = viewTree();
    else if (view === "list") body = viewList();
    else if (view === "rows") body = viewRows(false);
    else if (view === "lanes") body = viewRows(true);
    root.appendChild(body);

    if (wide && (view === "rows" || view === "lanes")) {
      var hint = h("div", "hint", S.sel ? (byId[S.sel].ru + " — учителя цветом, ученики пунктиром") : "Клик — связи, наведение — детали");
      root.appendChild(hint);
    }
    app.appendChild(root);
  }
  function reset() { S.sel = null; S.open = null; S.q = ""; S.pick = {}; S.desc = false; S.all = false; render(); }

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { render(); }, 120); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { S.sel = null; S.open = null; render(); } });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render); else render();
})();
</script>
</body>
</html>
