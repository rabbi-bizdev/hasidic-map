<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генеалогия первых трёх поколений хасидизма</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#2c3e50; --muted:#7b8794; --line:#e3e8ee;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;}
#app{max-width:1500px;margin:0 auto;}
.hdr{padding:22px 20px 10px;}
.hdr h1{font-size:24px;font-weight:700;letter-spacing:-.2px;}
.hdr .sub{color:var(--muted);font-size:13px;margin-top:6px;max-width:900px;}
.infoToggle{margin-top:10px;background:#eef2f7;border:1px solid var(--line);color:#516170;border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
.infoToggle:hover{background:#e6ecf3;}
.infoBox{display:none;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:960px;font-size:13px;color:#3d4a58;}
.infoBox.show{display:block;}
.infoBox p{margin:0 0 9px;} .infoBox p:last-child{margin-bottom:0;}
.infoBox .ib{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;color:#fff;text-align:center;font-size:11px;font-weight:700;vertical-align:middle;}
.infoBox .ib.out{background:#fff;color:#adb5bd;border:1.5px solid #ced4da;line-height:14px;}

.controls{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.94);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;}
.legend{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;color:#516170;cursor:pointer;user-select:none;transition:.15s;}
.chip .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
.chip:not(.on){opacity:.4;filter:grayscale(1);}
.ctl-right{display:flex;align-items:center;gap:12px;}
.search{border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px;min-width:180px;background:#fff;color:var(--text);}
.allWrap{font-size:12.5px;color:#516170;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}

.stage{position:relative;overflow:auto;padding:6px 20px 40px;}
svg.edges{position:absolute;top:6px;left:20px;pointer-events:none;z-index:1;overflow:visible;}
.map{position:relative;z-index:2;}
.band{margin:18px 0 6px;}
.band-title{font-size:13px;font-weight:700;color:#516170;text-transform:uppercase;letter-spacing:.4px;padding:6px 0 10px 12px;border-left:4px solid #ccd3db;margin-bottom:8px;}
.band-grid{display:flex;flex-wrap:wrap;gap:12px;}

.node{width:236px;background:var(--card);border:1px solid var(--line);border-left:5px solid #888;border-radius:9px;padding:11px 12px 10px;box-shadow:0 1px 3px rgba(20,40,70,.06);cursor:pointer;position:relative;transition:box-shadow .15s,transform .15s,opacity .15s;}
.node:hover{box-shadow:0 4px 14px rgba(20,40,70,.14);transform:translateY(-1px);}
.node-head{display:flex;flex-direction:column;gap:1px;}
.node-title{font-size:14px;font-weight:700;line-height:1.25;padding-right:20px;}
.node-he{font-size:12px;color:var(--muted);direction:rtl;unicode-bidi:isolate;}
.node-meta{font-size:11.5px;color:var(--muted);margin:5px 0 7px;}
.tl{font-size:11.5px;margin:2px 0;color:#40505f;}
.tl .tlk{color:#8a97a4;font-weight:600;}
.tl.sec,.tl.fam{color:#8794a1;}
.tl.fam{font-style:italic;}
.tl.root{color:#b8860b;font-weight:600;font-style:italic;}
.disp{color:#d35400;cursor:help;}
.badges{display:flex;gap:5px;margin-top:8px;}
.bdg{width:18px;height:18px;line-height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;text-align:center;text-decoration:none;display:inline-block;border:1.5px solid transparent;}
.bdg.out{background:#fff!important;color:#adb5bd;border-color:#ced4da;}
.noteBtn{position:absolute;top:9px;right:10px;width:18px;height:18px;border-radius:50%;border:none;background:#ffe08a;color:#8a6d00;font-weight:800;font-size:12px;cursor:pointer;line-height:18px;}
.node-note{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:#5a6875;}
.node.open .node-note{display:block;}

.node.sel{box-shadow:0 0 0 3px #2c3e50,0 6px 18px rgba(20,40,70,.2);}
.node.rel-teacher{box-shadow:0 0 0 2px #2980b9;}
.node.rel-student{box-shadow:0 0 0 2px #1e7e34;}
.node.dim{opacity:.32;}
.node.hidden{display:none;}

.ftr{padding:16px 20px 30px;font-size:11.5px;color:var(--muted);}
.ftr a{color:#516170;}
@media(max-width:600px){.node{width:100%;}.hdr h1{font-size:20px;}}
</style>
</head>

enka","k":"fam"}],"role":"Особый случай: без единого формального наставника; самостоятельное основание школы","verify":{"wiki_he":{"s":"url","url":"https://he.wikipedia.org/wiki/נחמן_מברסלב"},"chabadpedia":{"s":"na","url":null},"hamichlol":{"s":"na","url":null}},"note":"Правнук Бешта через мать Фейгу (дочь Адели). Формального учителя пок.2 не имел; духовно опирался на наследие Бешта и Городенкера"},{"id":"nathan_breslov","gen":4,"branch":"bratslav","ru":"Натан из Немирова (Реб Носон)","he":"נתן שטרנהרץ מברסלב","years":"1780–1844","known":"Главный ученик и писец р. Нахмана; «Ликутей Ѓалахот»","teachers":[{"t":"nachman_breslov","k":"main"}],"role":"Записал и издал наследие Нахмана; паломничество в Умань","verify":{"wiki_he":{"s":"url","url":"https://he.wikipedia.org/wiki/נתן_שטרנהרץ"},"chabadpedia":{"s":"na","url":null},"hamichlol":{"s":"na","url":null}},"note":"Поколение 4 (по просьбе — как мост). До Нахмана бывал у Леви Ицхака из Бердичева"},{"id":"israel_ruzhin","gen":4,"branch":"ruzhin","ru":"Исраэль из Ружина","he":"ישראל מרוז'ין","years":"1796–1850","known":"«Ружинер»; правнук Магида; «царский» двор","teachers":[{"t":"shalom_shachna_prohobisht","k":"fam"}],"role":"6 сыновей → Садгора, Боян, Чортков, Гусятин, Штефанешти, Богуш","verify":{"wiki_he":{"s":"na","url":null},"chabadpedia":{"s":"na","url":null},"hamichlol":{"s":"na","url":null}},"note":"Поколение 4 (по просьбе — как мост). После ареста бежал в Садгору (Австрия)"},{"id":"aaron_karlin_ii","gen":4,"branch":"karlin","ru":"Аарон II из Карлина (Бейт Аѓарон)","he":"אהרן מקרלין (השני)","years":"1802–1872","known":"«Бейт Аѓарон»; возродил Карлин-Столин","teachers":[{"t":"asher_stolin_i","k":"fam"}],"role":"Ключевой труд «Бейт Аѓарон»","verify":{"wiki_he":{"s":"url","url":"https://he.wikipedia.org/wiki/אהרן_מקרלין_(השני)"},"chabadpedia":{"s":"na","url":null},"hamichlol":{"s":"na","url":null}},"note":"Поколение 4 (по просьбе — как мост)"}];
var STUB_TEACHERS={"yitzchak_drohobych":"Ицхак из Дрогобыча (отец Злочовера, скрытый мистик)","rashash":"Шалом Шараби, Рашаш (каббала, Бейт-Эль)","yitzchak_pinchov":"Ицхак из Пинчова (ранний учитель Меира из Апты)","nachum_chernobyl_line":"линия Чернобыля (наставники Шалома Шахны)","shpoler_zeide":"Арье Лейб из Шполы (Шполер Зейде)"};
</script>
<script>/* Клиентское приложение карты. Использует глобальные BRANCHES, NODES, STUB_TEACHERS. */
(function () {
  "use strict";

  var GEN_TITLES = {
    1: "Поколение 1 — Бааль Шем Тов и его круг",
    2: "Поколение 2 — ученики Магида и других учителей 1-го поколения",
    3: "Поколение 3 — ученики 2-го поколения",
    4: "Поколение 4 — узлы-мосты (по запросу)"
  };
  var BRANCH_ORDER = ["founder","core","volhynia","galicia","hungary","chabad","chernobyl","karlin","ruzhin","bratslav"];
  var VERIFY = {
    read: { color:"#1e7e34", label:"текст статьи прочитан" },
    url:  { color:"#2980b9", label:"статья и URL подтверждены поиском" },
    none: { color:"#ced4da", label:"статьи на источнике нет" },
    na:   { color:"#e0a800", label:"не проверено (лимит поиска исчерпан)" }
  };
  var SRC_LABEL = { wiki_he:"Ивр. Википедия", chabadpedia:"Chabadpedia", hamichlol:"hamichlol (Михлол)" };
  var SRC_SHORT = { wiki_he:"В", chabadpedia:"Х", hamichlol:"М" };

  var byId = {};
  NODES.forEach(function (n) { byId[n.id] = n; });

  // students index
  var studentsOf = {};
  NODES.forEach(function (n) {
    (n.teachers || []).forEach(function (t) {
      if (byId[t.t]) { (studentsOf[t.t] = studentsOf[t.t] || []).push({ id: n.id, k: t.k, d: t.d }); }
    });
  });

  // edges (only where teacher is a real node)
  var edges = [];
  NODES.forEach(function (n) {
    (n.teachers || []).forEach(function (t) {
      if (byId[t.t]) edges.push({ from: t.t, to: n.id, k: t.k, d: !!t.d });
    });
  });

  var stage, svg, mapEl;
  var cardEls = {};
  var selected = null;
  var showAll = false;
  var activeBranches = {}; BRANCH_ORDER.forEach(function (b) { activeBranches[b] = true; });
  var query = "";

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function teacherLines(n) {
    var main = [], sec = [], fam = [];
    (n.teachers || []).forEach(function (t) {
      var name = byId[t.t] ? byId[t.t].ru : (STUB_TEACHERS[t.t] || t.t);
      var disp = esc(name) + (t.d ? ' <span class="disp" title="Атрибуция спорна между источниками">⚑</span>' : '');
      if (t.k === "main") main.push(disp);
      else if (t.k === "fam") fam.push(disp);
      else sec.push(disp);
    });
    var out = "";
    if (main.length) out += '<div class="tl"><span class="tlk">ученик:</span> ' + main.join(", ") + '</div>';
    if (sec.length)  out += '<div class="tl sec"><span class="tlk">также у:</span> ' + sec.join(", ") + '</div>';
    if (fam.length)  out += '<div class="tl fam"><span class="tlk">родство:</span> ' + fam.join(", ") + '</div>';
    if (!main.length && !sec.length && !fam.length) out += '<div class="tl root">— родоначальник —</div>';
    return out;
  }

  function badges(n) {
    var html = '<div class="badges">';
    ["wiki_he","chabadpedia","hamichlol"].forEach(function (src) {
      var v = (n.verify && n.verify[src]) || { s: "na" };
      var meta = VERIFY[v.s] || VERIFY.na;
      var title = SRC_LABEL[src] + ": " + meta.label + (v.url ? " — " + v.url : "");
      if (v.url) {
        html += '<a class="bdg" style="background:' + meta.color + '" href="' + esc(v.url) + '" target="_blank" rel="noopener" title="' + esc(title) + '" onclick="event.stopPropagation()">' + SRC_SHORT[src] + '</a>';
      } else {
        var outline = (v.s === "none");
        html += '<span class="bdg' + (outline ? ' out' : '') + '" style="' + (outline ? 'color:#adb5bd;border-color:#ced4da' : 'background:' + meta.color) + '" title="' + esc(title) + '">' + SRC_SHORT[src] + '</span>';
      }
    });
    html += '</div>';
    return html;
  }

  function makeCard(n) {
    var color = (BRANCHES[n.branch] || {}).color || "#888";
    var c = el("div", "node");
    c.style.borderLeftColor = color;
    c.setAttribute("data-id", n.id);
    c.setAttribute("data-branch", n.branch);
    var noteBtn = n.note ? '<button class="noteBtn" title="Примечание / расхождение" onclick="event.stopPropagation();this.closest(\'.node\').classList.toggle(\'open\')">!</button>' : '';
    c.innerHTML =
      '<div class="node-head">' +
        '<div class="node-title">' + esc(n.ru) + noteBtn + '</div>' +
        '<div class="node-he" dir="rtl">' + esc(n.he) + '</div>' +
      '</div>' +
      '<div class="node-meta">' + esc(n.years) + (n.known ? ' · ' + esc(n.known) : '') + '</div>' +
      teacherLines(n) +
      badges(n) +
      (n.note ? '<div class="node-note">' + esc(n.note) + '</div>' : '');
    c.addEventListener("click", function () { selectNode(selected === n.id ? null : n.id); });
    cardEls[n.id] = c;
    return c;
  }

  function build() {
    var root = document.getElementById("app");
    // header
    var header = el("header", "hdr");
    header.innerHTML =
      '<h1>Генеалогия первых трёх поколений хасидизма</h1>' +
      '<p class="sub">Кто чей ученик · связи «учитель→ученик» · ' + NODES.length + ' персон · ' + edges.length + ' связей. ' +
      'Проверка по трём источникам: ивр. Википедия · Chabadpedia · hamichlol.</p>' +
      '<button class="infoToggle" id="infoToggle">ⓘ о методике и чтении карты</button>' +
      '<div class="infoBox" id="infoBox">' +
        '<p><b>Как читать.</b> Строки — поколения. Цвет карточки — ветвь/школа (см. легенду). Сплошная стрелка — <b>главный учитель</b> (каркас дерева); пунктир — дополнительный учитель; точки — родство. По умолчанию видны только главные связи; нажмите на карточку, чтобы раскрыть все связи персоны (учителя вверх, ученики вниз), или включите «показать все связи».</p>' +
        '<p><b>Почему у многих 3–5 учителей.</b> Ранний хасидизм — сеть, а не система фиксированных «ребе→наследник». Каскад смертей учителей (Бешт 1760, Магид 1772, Элимелех 1787) отправлял учеников к следующему мастеру, поэтому «5 учителей» часто = последовательность во времени. Плюс различали рава по Талмуду и рава по пути служения. Плотная «паутина» сосредоточена в <b>польско-галицийской</b> ветви (Лиженск→Люблин→Риманов→Апта→Козниц), тогда как Хабад, Чернобыль, Карлин, Ружин — чистые цепочки отец→сын. Флажок ⚑ — атрибуция учителя спорна между источниками.</p>' +
        '<p><b>Оговорка по проверке.</b> В среде сбора три источника почти не открывались для прямого чтения. Поэтому бейджи: <span class="ib" style="background:#1e7e34">В</span> текст прочитан · <span class="ib" style="background:#2980b9">В</span> статья/URL подтверждены · <span class="ib out">В</span> статьи нет · <span class="ib" style="background:#e0a800">В</span> не проверено. Клик по бейджу — переход к статье. Генеалогия сверена с академическим консенсусом; расхождения не сглажены, а помечены (кнопка «!»).</p>' +
      '</div>';
    root.appendChild(header);

    // controls
    var controls = el("div", "controls");
    var legend = el("div", "legend");
    BRANCH_ORDER.forEach(function (b) {
      var br = BRANCHES[b]; if (!br) return;
      var chip = el("button", "chip on");
      chip.setAttribute("data-branch", b);
      chip.innerHTML = '<span class="sw" style="background:' + br.color + '"></span>' + esc(br.ru);
      chip.addEventListener("click", function () {
        activeBranches[b] = !activeBranches[b];
        chip.classList.toggle("on", activeBranches[b]);
        applyFilter();
      });
      legend.appendChild(chip);
    });
    controls.appendChild(legend);

    var right = el("div", "ctl-right");
    var search = el("input", "search"); search.type = "search"; search.placeholder = "Поиск по имени…";
    search.addEventListener("input", function () { query = search.value.trim().toLowerCase(); applyFilter(); });
    right.appendChild(search);
    var allWrap = el("label", "allWrap");
    allWrap.innerHTML = '<input type="checkbox" id="showAll"> показать все связи';
    right.appendChild(allWrap);
    controls.appendChild(right);
    root.appendChild(controls);

    // stage (bands + svg overlay)
    stage = el("div", "stage");
    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "edges");
    stage.appendChild(svg);
    mapEl = el("div", "map");
    stage.appendChild(mapEl);
    root.appendChild(stage);

    [1,2,3,4].forEach(function (g) {
      var band = el("div", "band");
      band.appendChild(el("div", "band-title", esc(GEN_TITLES[g])));
      var grid = el("div", "band-grid");
      NODES.filter(function (n) { return n.gen === g; })
        .sort(function (a, b) {
          var ai = BRANCH_ORDER.indexOf(a.branch), bi = BRANCH_ORDER.indexOf(b.branch);
          if (ai !== bi) return ai - bi;
          return a.ru.localeCompare(b.ru, "ru");
        })
        .forEach(function (n) { grid.appendChild(makeCard(n)); });
      band.appendChild(grid);
      mapEl.appendChild(band);
    });

    // footer
    var footer = el("footer", "ftr");
    footer.innerHTML = 'Источники (слои проверки): <a href="https://he.wikipedia.org" target="_blank" rel="noopener">he.wikipedia.org</a> · <a href="https://chabadpedia.co.il" target="_blank" rel="noopener">chabadpedia.co.il</a> · <a href="https://www.hamichlol.org.il" target="_blank" rel="noopener">hamichlol.org.il</a>. Флажок ⚑ — спорная атрибуция учителя; кнопка «!» на карточке — примечание/расхождение.';
    root.appendChild(footer);

    document.getElementById("infoToggle").addEventListener("click", function () {
      document.getElementById("infoBox").classList.toggle("show");
    });
    document.getElementById("showAll").addEventListener("change", function (e) { showAll = e.target.checked; redraw(); });
    stage.addEventListener("click", function (e) { if (e.target === stage || e.target === svg || e.target === mapEl) selectNode(null); });

    window.addEventListener("resize", function () { requestAnimationFrame(redraw); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { redraw(); });
    requestAnimationFrame(redraw);
    setTimeout(redraw, 300);
  }

  function centerOf(id, mode) {
    var c = cardEls[id]; if (!c) return null;
    var r = c.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    var x = r.left - sr.left + stage.scrollLeft + r.width / 2;
    var topY = r.top - sr.top + stage.scrollTop;
    var botY = topY + r.height;
    return { x: x, top: topY, bottom: botY, midY: topY + r.height / 2 };
  }

  function path(a, b) {
    // a=teacher, b=student. Prefer teacher bottom -> student top when teacher above.
    var x1 = a.x, x2 = b.x, y1, y2;
    if (a.midY <= b.midY) { y1 = a.bottom; y2 = b.top; }
    else { y1 = a.top; y2 = b.bottom; }
    var dy = (y2 - y1);
    var c1 = y1 + dy * 0.45, c2 = y2 - dy * 0.45;
    return "M" + x1 + "," + y1 + " C" + x1 + "," + c1 + " " + x2 + "," + c2 + " " + x2 + "," + y2;
  }

  function nodeVisible(n) {
    if (!activeBranches[n.branch]) return false;
    if (query && n.ru.toLowerCase().indexOf(query) === -1 && (n.he||"").toLowerCase().indexOf(query) === -1) return false;
    return true;
  }

  function redraw() {
    if (!stage) return;
    // size svg to content
    svg.setAttribute("width", mapEl.scrollWidth);
    svg.setAttribute("height", mapEl.scrollHeight);
    svg.setAttribute("viewBox", "0 0 " + mapEl.scrollWidth + " " + mapEl.scrollHeight);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var egoTeachers = {}, egoStudents = {};
    if (selected) {
      (byId[selected].teachers || []).forEach(function (t) { if (byId[t.t]) egoTeachers[t.t] = t; });
      (studentsOf[selected] || []).forEach(function (s) { egoStudents[s.id] = s; });
    }

    edges.forEach(function (e) {
      var tn = byId[e.from], sn = byId[e.to];
      if (!nodeVisible(tn) || !nodeVisible(sn)) return;
      var incident = selected && (e.from === selected || e.to === selected);
      var isMain = e.k === "main";
      if (!selected) { if (!showAll && !isMain) return; }
      else { if (!incident && !showAll && !isMain) return; }

      var a = centerOf(e.from), b = centerOf(e.to);
      if (!a || !b) return;
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", path(a, b));
      p.setAttribute("fill", "none");
      var col, w, op, dash = "";
      var col0 = (BRANCHES[sn.branch] || {}).color || "#888";
      if (selected && incident) {
        col = col0; w = 2.6; op = 0.95;
        if (e.k === "sec") dash = "6,4"; else if (e.k === "fam") dash = "1,5";
      } else if (selected) {
        col = "#c7ccd4"; w = 1; op = 0.28;
        if (!isMain) dash = "4,4";
      } else {
        col = isMain ? "#9aa2ad" : "#c7ccd4"; w = isMain ? 1.4 : 1; op = isMain ? 0.5 : 0.3;
        if (e.k === "sec") dash = "6,4"; else if (e.k === "fam") dash = "1,5";
      }
      p.setAttribute("stroke", col);
      p.setAttribute("stroke-width", w);
      p.setAttribute("opacity", op);
      if (dash) p.setAttribute("stroke-dasharray", dash);
      svg.appendChild(p);
    });

    // card highlight states
    NODES.forEach(function (n) {
      var c = cardEls[n.id]; if (!c) return;
      c.classList.remove("sel","rel-teacher","rel-student","dim","hidden");
      if (!nodeVisible(n)) { c.classList.add("hidden"); return; }
      if (selected) {
        if (n.id === selected) c.classList.add("sel");
        else if (egoTeachers[n.id]) c.classList.add("rel-teacher");
        else if (egoStudents[n.id]) c.classList.add("rel-student");
        else c.classList.add("dim");
      }
    });
  }

  function selectNode(id) {
    selected = id;
    redraw();
    if (id && cardEls[id]) cardEls[id].scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
  }
  function applyFilter() { redraw(); }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build);
  else build();
})();
</script>
</body>
</html>
